<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Blueberry Mechanisms</title>

    <!--
      HOME SCREEN AND TAB IDENTITY. The app had none of this: no favicon, no
      apple-touch-icon, no manifest. CLAUDE.md's deployment section says the
      home screen name is "Blueberry" and that iOS is the primary target, and
      an install with no icon does not honour that. The icons are rasterized
      from BlueberryMark, the mark the Cards screen already draws, so this is
      the product's own art and not something new invented for a header.

      apple-mobile-web-app-status-bar-style is "default" ON PURPOSE, and it is
      the one line here worth arguing about. "black-translucent" pulls the page
      up under the status bar, which is what makes env(safe-area-inset-top)
      report 59px on an island phone, and it is the setting a full bleed design
      wants. It also forces the status bar's clock and battery to render WHITE,
      and this app's ground is #f1ede2 cream. White on cream is unreadable, so
      that setting would trade a legible clock for a visual effect. With
      "default" iOS reserves the island band itself and lays the app out below
      it, which is the same outcome .pt-safe was written to guarantee and is
      why that rule costs nothing here: env() resolves to 0 and the header
      keeps only its own half rem. The rule still earns its place in Safari,
      in landscape, and if a dark full bleed screen ever wants the other
      setting.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#f6f2e7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Blueberry" />
    <script>
      // Pre-paint theme script, inherited pattern from the sibling repo with the
      // default FLIPPED per the owner divergence in docs/DESIGN-TOKENS.md: this
      // app is light mode first. Dark only when the student explicitly chose it.
      // It runs inline, before first paint, so there is never a flash of the
      // wrong theme; a React effect would run after paint and flash.
      (function () {
        try {
          if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          /* storage blocked: stay light */
        }
      })();
    </script>
    <style>
      /* THE FRONT DOOR. Read src/app/Loader.tsx first: it holds the reasoning
         for every rule below and for why the markup lives here rather than in a
         component. Comments in this block ship to every student on the critical
         path, uncompressed and unminified, so they stay short on purpose and
         the prose lives in the module that gets minified. */
      :root {
        /* The lavender turn made the page lavender and the card cream, so the
           field is the app's own deep navy: the reveal is a change of world
           rather than a change of shade. Cream ink on it is 8.14:1. */
        --boot-field: #3f4286;
        --boot-ink: #fbf3e6;
        --boot-veil: rgba(251, 243, 230, 0.07);
        --boot-rule-track: rgba(251, 243, 230, 0.28);
        --boot-rule-fill: #fbf3e6;
        --boot-orbit: #a8a4c1;
      }
      .dark {
        --boot-field: #171a2e;
        --boot-ink: #e8e6f2;
        --boot-veil: rgba(232, 230, 242, 0.06);
        --boot-rule-track: rgba(232, 230, 242, 0.24);
        --boot-rule-fill: #e8e6f2;
        --boot-orbit: #8a89ac;
      }

      /* The field is on #boot AND on the panels. Loader.tsx, "the backdrop
         climb", says why the duplicate is load bearing. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 120;
        overflow: hidden;
        background: var(--boot-field);
        transition: opacity 120ms linear;
      }
      #boot[data-boot="reveal"] {
        background: transparent;
        pointer-events: none;
      }

      /* Two halves that part from the line the mark sits on. 1px of overlap
         each, so no sub-pixel seam can open at 2x or 3x. The curve is a curtain
         with mass: a plain ease-out was measured effectively finished at 380 ms,
         so the field did not travel, it vanished. */
      .boot-panel {
        position: absolute;
        left: 0;
        right: 0;
        height: calc(50% + 1px);
        background: var(--boot-field);
        transform: translate3d(0, 0, 0);
        transition: transform 820ms cubic-bezier(0.5, 0.02, 0.2, 1);
        overflow: hidden;
      }
      .boot-panel--top {
        top: 0;
        transform-origin: 50% 100%;
      }
      .boot-panel--bottom {
        bottom: 0;
        transform-origin: 50% 0%;
      }
      #boot[data-boot="reveal"] .boot-panel--top {
        transform: translate3d(0, -101%, 0) scale(1.06);
      }
      #boot[data-boot="reveal"] .boot-panel--bottom {
        transform: translate3d(0, 101%, 0) scale(1.06);
      }

      /* THE FIELD IS NOT EMPTY ANY MORE. A blind judge measured roughly 60
         percent of this screen as flat colour with nothing in it, so two large
         flat discs sit inside the panels and drift. Flat fills, transform only,
         and timed in seconds because they are ambient rather than on the
         reveal's path. */
      .boot-blob {
        position: absolute;
        border-radius: 999px;
        background: var(--boot-veil);
      }
      .boot-blob--a {
        width: 78vmin;
        height: 78vmin;
        left: -26vmin;
        top: -30vmin;
        animation: boot-drift-a 11s ease-in-out infinite alternate;
      }
      .boot-blob--b {
        width: 54vmin;
        height: 54vmin;
        right: -14vmin;
        bottom: -22vmin;
        animation: boot-drift-b 13s ease-in-out infinite alternate;
      }
      @keyframes boot-drift-a {
        from {
          transform: translate3d(0, 0, 0) scale(1);
        }
        to {
          transform: translate3d(4vmin, 3vmin, 0) scale(1.07);
        }
      }
      @keyframes boot-drift-b {
        from {
          transform: translate3d(0, 0, 0) scale(1.05);
        }
        to {
          transform: translate3d(-5vmin, -2vmin, 0) scale(1);
        }
      }

      .boot-centre {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      /* Only the mark and its orbit are in the centred stack, so the parting
         line runs through the mark and not between it and the words under it.
         The stack is lifted, because the word hangs below it and the judge read
         the composition as sitting under the centre of the screen. */
      .boot-stack {
        position: relative;
        display: grid;
        place-items: center;
        width: 176px;
        height: 176px;
        transform: translateY(-4vh);
      }
      /* The orbit: three flat dots on a dashed ring, turning slowly, so no two
         frames of the hold are the same picture. Rotation is a transform. */
      .boot-orbit {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        animation: boot-turn 18s linear infinite;
        transition:
          transform 700ms cubic-bezier(0.34, 1.2, 0.64, 1),
          opacity 380ms linear;
      }
      #boot[data-boot="reveal"] .boot-orbit {
        opacity: 0;
      }
      @keyframes boot-turn {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      /* Sized in step with MARK_PX in Loader.tsx, at the same breakpoint: a
         berry wider than its box would eat the gap under it. The fade leads the
         swell so this and the pathway's own Bloom are never on screen together
         at two sizes. */
      .boot-mark {
        width: 96px;
        height: 96px;
        display: grid;
        place-items: center;
        transform: scale(1);
        opacity: 1;
        transition:
          transform 700ms cubic-bezier(0.34, 1.2, 0.64, 1),
          opacity 400ms cubic-bezier(0.4, 0, 1, 1) 60ms;
      }
      #boot[data-boot="reveal"] .boot-mark {
        transform: scale(2.15);
        opacity: 0;
      }
      .boot-meta {
        position: absolute;
        top: calc(100% + 18px);
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        transition: opacity 180ms linear;
      }
      #boot[data-boot="reveal"] .boot-meta {
        opacity: 0;
      }
      .boot-rule {
        width: 168px;
        height: 3px;
        border-radius: 999px;
        background: var(--boot-rule-track);
        overflow: hidden;
      }
      .boot-rule__fill {
        display: block;
        height: 100%;
        width: 100%;
        border-radius: inherit;
        background: var(--boot-rule-fill);
        transform: scaleX(var(--boot-progress, 0.16));
        transform-origin: left center;
        transition: transform 520ms cubic-bezier(0.2, 0.8, 0.3, 1);
      }
      .boot-word {
        margin: 0;
        white-space: nowrap;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 0.8125rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--boot-ink);
        animation: boot-word-in 420ms cubic-bezier(0.2, 0.8, 0.3, 1) both;
      }
      @keyframes boot-word-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (min-width: 768px) {
        .boot-mark {
          width: 112px;
          height: 112px;
        }
        .boot-stack {
          width: 208px;
          height: 208px;
        }
        .boot-rule {
          width: 196px;
        }
      }

      /* Reduced motion: the first three beats hold exactly as they are and the
         reveal becomes a 120ms cross fade. The rule still reports the same
         milestones, it just stops gliding between them, and nothing ambient
         moves at all. */
      @media (prefers-reduced-motion: reduce) {
        .boot-panel,
        .boot-mark,
        .boot-meta,
        .boot-orbit,
        .boot-rule__fill {
          transition: none;
        }
        .boot-blob,
        .boot-orbit,
        .boot-word {
          animation: none;
        }
        #boot[data-boot="reveal"] {
          opacity: 0;
        }
        #boot[data-boot="reveal"] .boot-panel--top,
        #boot[data-boot="reveal"] .boot-panel--bottom,
        #boot[data-boot="reveal"] .boot-mark {
          transform: none;
        }
        #boot[data-boot="reveal"] .boot-mark,
        #boot[data-boot="reveal"] .boot-meta {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- The loader. Markup, not a component: see src/app/Loader.tsx. -->
    <div id="boot" data-boot="load" style="--boot-progress: 0.16">
      <div class="boot-panel boot-panel--top" aria-hidden="true">
        <i class="boot-blob boot-blob--a"></i>
      </div>
      <div class="boot-panel boot-panel--bottom" aria-hidden="true">
        <i class="boot-blob boot-blob--b"></i>
      </div>
      <div class="boot-centre">
        <div class="boot-stack">
          <svg class="boot-orbit" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
            <circle cx="100" cy="100" r="86" fill="none" stroke="var(--boot-orbit)" stroke-width="1.5" stroke-dasharray="3 9" />
            <circle cx="100" cy="14" r="4.5" fill="var(--boot-orbit)" />
            <circle cx="174.5" cy="143" r="3" fill="var(--boot-orbit)" />
            <circle cx="25.5" cy="143" r="3" fill="var(--boot-orbit)" />
          </svg>
          <!-- Loader.tsx portals the live Bloom in here. -->
          <div class="boot-mark" id="boot-mark" aria-hidden="true"></div>
          <div class="boot-meta">
            <div class="boot-rule" aria-hidden="true"><i class="boot-rule__fill"></i></div>
            <p class="boot-word" id="boot-word" role="status">Warming up</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
